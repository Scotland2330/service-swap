<style>
  :root {
    --ground: #f2f5f3;
    --surface: #ffffff;
    --surface-2: #f7faf8;
    --ink: #14211d;
    --ink-2: #43524c;
    --ink-3: #6b7a73;
    --border: #dde5e1;
    --border-2: #cbd6d0;
    --brand: #1f7a63;
    --brand-strong: #185f4d;
    --brand-tint: #e4f0ec;
    --brand-ink: #12463a;
    --amber: #b45309;
    --amber-tint: #fdf0dd;
    --gold: #9a6b12;
    --gold-tint: #f8efd8;
    --blue: #1d4ed8;
    --blue-tint: #e5edff;
    --danger: #c0392b;
    --danger-tint: #fbe9e7;
    --shadow: 0 1px 2px rgba(20,33,29,.05), 0 10px 30px -16px rgba(20,33,29,.20);
    --shadow-lg: 0 2px 6px rgba(20,33,29,.06), 0 24px 60px -24px rgba(20,33,29,.30);
    --radius: 16px;
    --radius-sm: 10px;
    --maxw: 1080px;
    --font: 'Figtree', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1512;
      --surface: #16211d;
      --surface-2: #1b2823;
      --ink: #e9efec;
      --ink-2: #b3c1ba;
      --ink-3: #8b9a92;
      --border: #2a3b34;
      --border-2: #35473f;
      --brand: #4fb89b;
      --brand-strong: #6fccb0;
      --brand-tint: #17342b;
      --brand-ink: #a7e3d1;
      --amber: #e0913f;
      --amber-tint: #362617;
      --gold: #d6ab5a;
      --gold-tint: #322914;
      --blue: #7aa2ff;
      --blue-tint: #1b2540;
      --danger: #e8776a;
      --danger-tint: #3a1f1c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1512;
    --surface: #16211d;
    --surface-2: #1b2823;
    --ink: #e9efec;
    --ink-2: #b3c1ba;
    --ink-3: #8b9a92;
    --border: #2a3b34;
    --border-2: #35473f;
    --brand: #4fb89b;
    --brand-strong: #6fccb0;
    --brand-tint: #17342b;
    --brand-ink: #a7e3d1;
    --amber: #e0913f;
    --amber-tint: #362617;
    --gold: #d6ab5a;
    --gold-tint: #322914;
    --blue: #7aa2ff;
    --blue-tint: #1b2540;
    --danger: #e8776a;
    --danger-tint: #3a1f1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }
  h1, h2 { margin: 0; text-wrap: balance; font-family: var(--display); font-weight: 600; font-optical-sizing: auto; letter-spacing: -0.005em; line-height: 1.1; }
  h3 { margin: 0; text-wrap: balance; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
  p { margin: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #app { animation: fadeUp .34s cubic-bezier(.2,.7,.2,1); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }

  /* ---------- header ---------- */

/* value-equivalence engine (mirrors the real app) */
function suggestCash(offered, requested){
  const diff = Math.round((requested-offered)*100)/100;
  if(Math.abs(diff)<0.01) return { payer:'NONE', amount:0 };
  return diff>0 ? { payer:'INITIATOR', amount:diff } : { payer:'RECIPIENT', amount:Math.abs(diff) };
}
function computeBalance(offered, requested, cash, payer){
  cash = payer==='NONE'?0:Math.max(0, cash||0);
  const offeredTotal = offered + (payer==='INITIATOR'?cash:0);
  const requestedTotal = requested + (payer==='RECIPIENT'?cash:0);
  const diff = requestedTotal - offeredTotal;
  const absd = Math.abs(diff);
  const max = Math.max(offeredTotal, requestedTotal, 1);
  const pct = Math.max(0, Math.min(100, Math.round((1 - absd/max)*100)));
  const balanced = absd <= Math.max(10, max*0.05);
  let status='balanced', label = cash>0?'Balanced with cash':'Balanced trade';
  if(!balanced){
    if(diff>0){ status='recipient-favored'; label = "You'd receive "+money(absd)+" more value than you give"; }
    else { status='initiator-favored'; label = "You'd give "+money(absd)+" more value than you receive"; }
  }
  return { offeredTotal, requestedTotal, pct, status, label, balanced };
}

function statusBadge(st){
  const map = { PENDING:['b-amber','Pending'], ACCEPTED:['b-blue','Accepted'], COMPLETED:['b-brand','Completed'], DECLINED:['b-gray','Declined'], CANCELLED:['b-gray','Withdrawn'], OPEN:['b-amber','Open'], FULFILLED:['b-brand','Fulfilled'], CLOSED:['b-gray','Closed'] };
  const [c,l] = map[st] || ['b-gray', st];
  return '<span class="badge '+c+'">'+l+'</span>';
}

afterRender.browse = function(){
  const catHidden = $('cat');
  function markChips(){ document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.chip===catHidden.value)); }
  const val = s => s.model==='FIXED'? s.fixed : s.rate;
  function draw(){
    const q = ($('q').value||'').toLowerCase().trim();
    const cat = catHidden.value, sort = $('sort').value, model = $('model').value;
    let list = Object.values(state.services).filter(s=>s.active).filter(s=>{
      if(cat!=='all' && s.category!==cat) return false;
      if(model!=='any' && s.model!==model) return false;
      if(q){ const b=biz(s.biz); return (s.title+' '+s.desc+' '+b.name+' '+(s.skills||[]).join(' ')).toLowerCase().includes(q); }
      return true;
    });
    if(sort==='high') list.sort((a,b)=>val(b)-val(a));
    else if(sort==='low') list.sort((a,b)=>val(a)-val(b));
    else if(sort==='rating') list.sort((a,b)=>biz(b.biz).rating-biz(a.biz).rating);
    else list.sort((a,b)=>a.id<b.id?1:-1);
    $('resultsMeta').textContent = list.length+' service'+(list.length===1?'':'s')+(cat!=='all'? ' in '+catName(cat) : ' available');
    $('results').innerHTML = list.length ? list.map(serviceCard).join('') :
      '<div class="card empty" style="grid-column:1/-1"><div class="ico">'+icon('spark',22)+'</div><h3>No services found</h3><p class="muted" style="margin-top:6px">Try a different search or category.</p></div>';
    markChips();
  }
  $('q').addEventListener('input', draw);
  $('sort').addEventListener('change', draw);
  $('model').addEventListener('change', draw);
  document.querySelectorAll('#catChips .chip').forEach(c=>c.addEventListener('click', ()=>{ catHidden.value=c.dataset.chip; draw(); }));
  draw();
};

afterRender.propose = function(){
  const card = $('proposeCard'); if(!card) return;
  const mine = JSON.parse(card.dataset.mine);
  const reqs = JSON.parse(card.dataset.req);
  const requestId = card.dataset.requestid || null;
  const g = id => $(id);
  let cashTouched = false;

  function calc(){
    const off = mine.find(s=>s.id===g('offSel').value) || mine[0];
    const req = reqs.find(s=>s.id===g('reqSel').value) || reqs[0];
    const offQty = Math.max(0, parseFloat(g('offQty').value)||0);
    const reqQty = Math.max(0, parseFloat(g('reqQty').value)||0);
    const offVal = serviceValue(off, offQty);
    const reqVal = serviceValue(req, reqQty);
    const sug = suggestCash(offVal, reqVal);
    if(!cashTouched) g('cashInput').value = Math.round(sug.amount);
    const cash = Math.max(0, parseFloat(g('cashInput').value)||0);
    const bal = computeBalance(offVal, reqVal, cash, sug.payer);

    g('offUnit').textContent = unit(off.model, offQty);
    g('reqUnit').textContent = unit(req.model, reqQty);
    g('offVal').textContent = money(offVal);
    g('reqVal').textContent = money(reqVal);
    const iPay = sug.payer==='INITIATOR', theyPay = sug.payer==='RECIPIENT';
    g('offCash').innerHTML = (iPay && cash>0)? '+ '+money(cash)+' cash' : '';
    g('reqCash').innerHTML = (theyPay && cash>0)? '+ '+money(cash)+' cash' : '';

    // cash box
    const cb = g('cashBox');
    if(sug.payer==='NONE'){ cb.style.display='none'; }
    else {
      cb.style.display='';
      const sliderMax = Math.max(Math.ceil(sug.amount*2/10)*10, Math.ceil(reqVal/10)*10, 50);
      const sl = g('cashSlider');
      sl.max = sliderMax;
      sl.value = Math.min(cash, sliderMax);
      g('cashLead').textContent = iPay ? "Your service is worth less — add cash to balance it" : "Your service is worth more — they can add cash";
      g('cashGap').textContent = money(sug.amount)+' to balance';
      g('balanceBtn').textContent = 'Balance ('+money(sug.amount)+')';
      g('cashHint').innerHTML = iPay
        ? "Totally fine to trade a smaller service and top up the rest in cash. You give <b>"+money(offVal)+"</b> in service + <b>"+money(cash)+"</b> cash."
        : "Their service is worth less, so they'd add <b>"+money(cash)+"</b> cash to even it out.";
    }
    // meter
    g('balFill').style.width = bal.pct+'%';
    g('balFill').style.background = bal.balanced ? 'var(--brand)' : (bal.pct>=70?'var(--amber)':'var(--danger)');
    const bb = g('balBadge');
    bb.textContent = bal.pct+'% balanced';
    bb.className = 'badge ' + (bal.balanced?'b-brand':'b-amber');
    g('balLabel').innerHTML = money(bal.offeredTotal)+' for '+money(bal.requestedTotal)+' — '+bal.label;

    card._data = { off, req, offQty, reqQty, offVal, reqVal, cash: (sug.payer==='NONE'?0:cash), payer: (cash>0?sug.payer:'NONE'), requestId };
  }
  function reqBizName(){ return document.querySelector('h1').textContent.replace(/^.*to\s/,''); }

  ['offSel','reqSel','offQty','reqQty'].forEach(id=>{ const e=g(id); if(e){ e.addEventListener('input', ()=>{ cashTouched=false; calc(); }); }});
  g('cashInput').addEventListener('input', ()=>{ cashTouched=true; calc(); });
  g('cashSlider').addEventListener('input', ()=>{ cashTouched=true; g('cashInput').value=g('cashSlider').value; calc(); });
  g('balanceBtn').addEventListener('click', ()=>{ cashTouched=false; calc(); });
  g('noCashBtn').addEventListener('click', ()=>{ cashTouched=true; g('cashInput').value=0; calc(); });
  g('sendBtn').addEventListener('click', ()=>{
    const d = card._data;
    const req = state.services[d.req.id];
    const id = nid('p');
    state.swaps[id] = {
      id, from: state.currentUser, to: req.biz,
      offeredService: d.off.id, offeredQty: d.offQty, offeredValue: d.offVal,
      requestedService: d.req.id, requestedQty: d.reqQty, requestedValue: d.reqVal,
      cash: d.cash, cashPayer: d.payer,
      message: g('msg').value.trim()||null, terms: g('terms').value.trim()||null,
      status:'PENDING', requestId: d.requestId, created: Date.now(),
      events: [{ who: state.currentUser, kind:'CREATED', note: g('msg').value.trim()||null, at: Date.now() }]
    };
    save(); toast(requestId?'Offer sent':'Proposal sent'); go('swap', { id });
  });
  calc();
};

/* ---- request detail ---- */
function viewRequest(id){
  const r = state.requests[id]; if(!r) return notFound();
  const b = biz(r.biz);
  const isOwner = r.biz===state.currentUser;
  const offers = Object.values(state.swaps).filter(s=>s.requestId===r.id).sort((a,b)=>b.created-a.created);
  const myOffer = Object.values(state.swaps).find(s=>s.requestId===r.id && s.from===state.currentUser);
  const requesterServices = Object.values(state.services).filter(s=>s.biz===r.biz && s.active);

  let side;
  if(isOwner){
    side = `<h2 style="font-size:18px;margin:26px 0 12px" class="row">Offers received ${offers.length?'<span class="tab-badge" style="position:static">'+offers.length+'</span>':''}</h2>`
      + (offers.length? '<div class="stack">'+offers.map(swapRow).join('')+'</div>'
        : '<div class="card pad muted" style="font-size:13.5px">No offers yet. Switch “Acting as” to another business to send one.</div>');
  } else if(r.status!=='OPEN'){
    side = '<div class="card pad muted" style="margin-top:26px">This request is '+r.status.toLowerCase()+' and isn’t taking offers.</div>';
  } else if(myOffer){
    side = '<div class="card pad" style="margin-top:26px"><p class="muted" style="font-size:13.5px">You’ve already sent an offer for this request.</p><button class="btn ghost" style="margin-top:12px" data-nav="swap" data-id="'+myOffer.id+'">View your offer</button></div>';
  } else if(!requesterServices.length){
    side = '<div class="card pad" style="margin-top:26px"><div class="badge b-amber">Nothing to trade back</div><p style="margin-top:10px;font-size:13.5px">'+esc(b.name)+' hasn’t listed a service to trade in return, so there’s nothing to receive yet.</p></div>';
  } else {
    side = '<div class="card pad" style="margin-top:26px"><h3 style="font-size:16px">Send an offer</h3><p class="muted" style="font-size:13.5px;margin-top:4px">Offer a service to fulfill this, and pick what you’d like in return.</p><button class="btn primary" style="margin-top:14px" data-nav="propose" data-id="'+requesterServices[0].id+'" data-requestid="'+r.id+'">Build an offer</button></div>';
  }

  return `
  <span class="backlink" data-nav="requests">${icon('back',15)} Back to requests</span>
  <div class="card pad">
    <div class="between" style="align-items:flex-start">
      <div><span class="badge b-amber">${catIcon(r.category,13)}<span>${esc(catName(r.category))}</span></span><h1 style="font-size:23px;margin-top:12px">${esc(r.title)}</h1></div>
      <div style="text-align:right">${r.status!=='OPEN'? statusBadge(r.status) : (r.estValue?'<span class="price tnum" style="font-size:18px">~'+money(r.estValue)+'</span>':'')}</div>
    </div>
    <p style="margin-top:14px;color:var(--ink-2);white-space:pre-wrap">${esc(r.desc)}</p>
    ${r.offering? '<div class="card pad" style="box-shadow:none;background:var(--surface-2);margin-top:14px;font-size:13.5px"><b>Offering in return:</b> <span class="muted">'+esc(r.offering)+'</span></div>':''}
    <div class="between" style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
      <div class="row">${avatar(b,30)}<span style="font-weight:600;font-size:14px">${esc(b.name)}</span></div>
      ${isOwner? '<button class="btn subtle" data-act="closeRequest" data-id="'+r.id+'">'+(r.status==='CLOSED'?'Reopen':'Close request')+'</button>':''}
    </div>
  </div>
  ${side}`;
}

/* ---- swaps list ---- */
let swapFilter = 'all';
function viewSwaps(){
  const me2 = state.currentUser;
  const all = Object.values(state.swaps).filter(s=>s.from===me2||s.to===me2);
  const filters = [['all','All'],['incoming','Incoming'],['outgoing','Outgoing'],['active','Active'],['completed','Completed']];
  let list = all;
  if(swapFilter==='incoming') list = all.filter(s=>s.to===me2);
  else if(swapFilter==='outgoing') list = all.filter(s=>s.from===me2);
  else if(swapFilter==='active') list = all.filter(s=>s.status==='PENDING'||s.status==='ACCEPTED');
  else if(swapFilter==='completed') list = all.filter(s=>s.status==='COMPLETED');
  list = list.sort((a,b)=>b.created-a.created);
  return `
  <h1 style="font-size:24px">Your swaps</h1>
  <p class="muted" style="margin-top:4px">Proposals ${esc(me().name)} has sent and received.</p>
  <div class="wrap" style="margin:18px 0" id="swapFilters">
    ${filters.map(([k,l])=>'<button class="btn '+(swapFilter===k?'primary':'ghost')+'" style="padding:6px 14px" data-filter="'+k+'">'+l+'</button>').join('')}
  </div>
  ${list.length? '<div class="stack">'+list.map(swapRow).join('')+'</div>' :
    '<div class="card empty"><div class="ico">'+icon('swap',22)+'</div><h3>No swaps here yet</h3><p class="muted" style="margin-top:6px">Browse services and propose a trade to get started.</p><button class="btn primary" style="margin-top:14px" data-nav="browse">Browse services</button></div>'}`;
}
afterRender.swaps = function(){
  document.querySelectorAll('#swapFilters [data-filter]').forEach(b=>b.addEventListener('click',()=>{ swapFilter=b.dataset.filter; render(); }));
};
function swapRow(s){
  const meId = state.currentUser;
  const iAmFrom = s.from===meId;
  const other = biz(iAmFrom? s.to : s.from);
  const giveS = svc(iAmFrom? s.offeredService : s.requestedService);
  const getS  = svc(iAmFrom? s.requestedService : s.offeredService);
  const giveQ = iAmFrom? s.offeredQty : s.requestedQty;
  const getQ  = iAmFrom? s.requestedQty : s.offeredQty;
  const giveV = iAmFrom? s.offeredValue : s.requestedValue;
  const getV  = iAmFrom? s.requestedValue : s.offeredValue;
  let cashLine = '';
  if(s.cashPayer!=='NONE' && s.cash>0){
    const iPay = (s.cashPayer==='INITIATOR')===iAmFrom;
    cashLine = '<div style="text-align:center;border-top:1px solid var(--border);margin-top:12px;padding-top:10px;font-size:12.5px;font-weight:600;color:var(--brand)" class="tnum">'+icon('cash',13)+' '+(iPay?'You add ':other.name+' adds ')+money(s.cash)+' cash</div>';
  }
  return `<div class="card pad clickcard" data-nav="swap" data-id="${s.id}">
    <div class="between">
      <div class="row"><span class="badge ${iAmFrom?'b-gray':'b-brand'}">${iAmFrom?'Sent':'Received'}</span><div class="row" style="gap:6px">${avatar(other,20)}<span class="muted" style="font-size:13px">${esc(other.name)}</span></div>${s.requestId?'<span class="badge b-gold">From a request</span>':''}</div>
      ${statusBadge(s.status)}
    </div>
    <div class="give-get" style="margin-top:14px;grid-template-columns:1fr auto 1fr;align-items:center">
      <div><div class="muted" style="font-size:11px">${iAmFrom?'You give':'You get'}</div><div style="font-weight:600;font-size:14px">${esc(giveS.title)}</div><div class="muted tnum" style="font-size:12.5px">${giveQ} ${unit(giveS.model,giveQ)} · ${money(giveV)}</div></div>
      <span style="color:var(--brand)">${icon('swap',16)}</span>
      <div style="text-align:right"><div class="muted" style="font-size:11px">${iAmFrom?'You get':'You give'}</div><div style="font-weight:600;font-size:14px">${esc(getS.title)}</div><div class="muted tnum" style="font-size:12.5px">${getQ} ${unit(getS.model,getQ)} · ${money(getV)}</div></div>
    </div>
    ${cashLine}
  </div>`;
}

/* ---- swap detail ---- */
function viewSwap(id){
  const s = state.swaps[id]; if(!s) return notFound();
  const meId = state.currentUser;
  const isFrom = s.from===meId, isTo = s.to===meId;
  if(!isFrom && !isTo){
    return '<div class="card pad" style="margin-top:8px"><div class="badge b-amber">Not your swap</div><p style="margin-top:10px">This proposal is between <b>'+esc(biz(s.from).name)+'</b> and <b>'+esc(biz(s.to).name)+'</b>. Switch “Acting as” to one of them to view and act on it.</p></div>';
  }
  const fromB = biz(s.from), toB = biz(s.to);
  const offS = svc(s.offeredService), reqS = svc(s.requestedService);
  const bal = computeBalance(s.offeredValue, s.requestedValue, s.cash, s.cashPayer);
  const other = isFrom? toB : fromB;

  // actions
  let actions = '';
  if(s.status==='PENDING' && isTo) actions = '<button class="btn primary" data-act="accept" data-id="'+s.id+'">Accept swap</button><button class="btn danger" data-act="decline" data-id="'+s.id+'">Decline</button>';
  else if(s.status==='PENDING' && isFrom) actions = '<button class="btn danger" data-act="cancel" data-id="'+s.id+'">Withdraw proposal</button>';
  else if(s.status==='ACCEPTED') actions = '<button class="btn primary" data-act="complete" data-id="'+s.id+'">Mark as completed</button>';

  const cashInit = s.cashPayer==='INITIATOR' && s.cash>0 ? s.cash : 0;
  const cashRecip = s.cashPayer==='RECIPIENT' && s.cash>0 ? s.cash : 0;

  const evLabel = { CREATED:'proposed the swap', ACCEPTED:'accepted the swap', DECLINED:'declined the swap', CANCELLED:'withdrew the proposal', COMPLETED:'marked the swap complete' };

  return `
  <span class="backlink" data-nav="swaps">${icon('back',15)} Back to swaps</span>
  <div class="between"><h1 style="font-size:23px">Swap proposal</h1>${statusBadge(s.status)}</div>
  <p class="muted" style="margin-top:4px">${isFrom?'You proposed this to':'Proposed to you by'} <b style="color:var(--ink)">${esc(other.name)}</b>${s.requestId&&state.requests[s.requestId]?' · in response to request “'+esc(state.requests[s.requestId].title)+'”':''}</p>

  <div class="card pad" style="margin-top:16px">
    <div class="give-get">
      ${tradeSide(isFrom?'You give':fromB.name+' gives', fromB, offS, s.offeredQty, s.offeredValue, cashInit)}
      <div class="gg-mid"><span class="gg-arrow">${icon('swap',18)}</span></div>
      ${tradeSide(isFrom?'You get':toB.name+' gives', toB, reqS, s.requestedQty, s.requestedValue, cashRecip)}
    </div>
    <div style="margin-top:18px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px">
      <div class="between"><span style="font-weight:600;font-size:13.5px" class="tnum">${money(bal.offeredTotal)} for ${money(bal.requestedTotal)}${s.cash>0?' <span class="muted" style="font-weight:400">(incl. '+money(s.cash)+' cash)</span>':''}</span><span class="badge ${bal.balanced?'b-brand':'b-amber'}">${bal.pct}% balanced</span></div>
      <div class="meter-track" style="margin-top:9px"><div class="meter-fill" style="width:${bal.pct}%;background:${bal.balanced?'var(--brand)':'var(--amber)'}"></div></div>
    </div>
    ${s.terms? '<div style="margin-top:14px"><div class="eyebrow">Proposed terms</div><p style="margin-top:6px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap">'+esc(s.terms)+'</p></div>':''}
    <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px" class="wrap">
      ${actions}
      ${s.status==='COMPLETED'?'<span style="color:var(--brand);font-weight:600;font-size:14px">'+icon('check',15)+' This swap is complete. Nice trade!</span>':''}
      ${(s.status==='DECLINED'||s.status==='CANCELLED')?'<span class="muted" style="font-size:14px">This proposal is closed.</span>':''}
    </div>
  </div>

  <div class="card pad" style="margin-top:16px">
    <h2 style="font-size:16px">Activity</h2>
    <div style="margin-top:10px">
      ${s.events.map(e=>{
        const a = biz(e.who);
        return '<div class="timeline-item">'+avatar(a,26)+'<div style="flex:1"><div style="font-size:13.5px"><b>'+esc(a.name)+'</b> <span class="muted">'+(e.kind==='MESSAGE'?'wrote:':evLabel[e.kind]||'')+'</span></div>'+(e.note?'<div class="note-bubble">'+esc(e.note)+'</div>':'')+'<div class="muted" style="font-size:11.5px;margin-top:3px">'+timeAgo(e.at)+'</div></div></div>';
      }).join('')}
    </div>
    ${(s.status!=='DECLINED'&&s.status!=='CANCELLED')? '<div class="row" style="margin-top:12px"><input id="noteInput" class="input" placeholder="Add a message…"><button class="btn ghost" data-act="message" data-id="'+s.id+'">Send</button></div>':''}
  </div>`;
}
function tradeSide(label, b, s, qty, val, cash){
  return `<div class="gg-panel">
    <div class="eyebrow">${esc(label)}</div>
    <div class="row" style="gap:6px;margin-top:8px">${avatar(b,20)}<span class="muted" style="font-size:12px">${esc(b.name)}</span></div>
    <div style="font-weight:650;margin-top:8px">${esc(s.title)}</div>
    <div class="muted tnum" style="font-size:13px;margin-top:2px">${qty} ${unit(s.model,qty)}</div>
    <div class="bigval tnum" style="margin-top:8px;color:var(--brand)">${money(val)}</div>
    ${cash>0?'<div style="font-size:13px;font-weight:600;margin-top:3px" class="tnum">+ '+money(cash)+' cash '+icon('cash',13)+'</div>':''}
  </div>`;
}

  </div>
  <div style="margin-top:20px">${body}</div>`;
}

/* ---- help bar ---- */
function helpBar(){
  if(state.helpDismissed) return '';
  return `<div class="helpbar"><span>${icon('spark',16)}</span><div><b>You're in a prototype.</b> Everything works in your browser — nothing is saved to a server. Use <b>“Acting as”</b> (top-right) to switch businesses and see both sides of a trade; a swap you send as one business, you accept as the other. Hit reset (↻) anytime.</div><span class="x" data-act="dismissHelp">✕</span></div>`;
}

/* ---- swap actions ---- */
function swapTransition(id, kind){
  const s = state.swaps[id]; if(!s) return;
  const meId = state.currentUser;
  const isFrom=s.from===meId, isTo=s.to===meId;
  const ok = { ACCEPTED: isTo&&s.status==='PENDING', DECLINED: isTo&&s.status==='PENDING', CANCELLED: isFrom&&s.status==='PENDING', COMPLETED:(isFrom||isTo)&&s.status==='ACCEPTED' }[kind];
  if(!ok){ toast("That action isn't available right now"); return; }
  s.status = kind;
  s.events.push({ who:meId, kind, at:Date.now() });
  if(kind==='ACCEPTED' && s.requestId && state.requests[s.requestId]) state.requests[s.requestId].status='FULFILLED';
  save();
  toast({ACCEPTED:'Swap accepted',DECLINED:'Proposal declined',CANCELLED:'Proposal withdrawn',COMPLETED:'Marked complete'}[kind]);
  render();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', (e)=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){
    go(nav.dataset.nav, { id: nav.dataset.id, requestId: nav.dataset.requestid, cat: nav.dataset.cat });
    return;
  }
  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act, id = act.dataset.id;
    if(a==='accept') swapTransition(id,'ACCEPTED');
    else if(a==='decline') swapTransition(id,'DECLINED');
    else if(a==='cancel') swapTransition(id,'CANCELLED');
    else if(a==='complete') swapTransition(id,'COMPLETED');
    else if(a==='message'){ const inp=$('noteInput'); const v=(inp.value||'').trim(); if(!v) return; state.swaps[id].events.push({who:state.currentUser,kind:'MESSAGE',note:v,at:Date.now()}); save(); render(); }
    else if(a==='toggleService'){ const s=state.services[id]; s.active=!s.active; save(); toast(s.active?'Service reactivated':'Service deactivated'); render(); }
    else if(a==='closeRequest'){ const r=state.requests[id]; r.status = r.status==='CLOSED'?'OPEN':'CLOSED'; save(); render(); }
    else if(a==='dismissHelp'){ state.helpDismissed=true; save(); render(); }
    return;
  }
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && e.target.id==='noteInput'){ const btn=document.querySelector('[data-act="message"]'); if(btn) btn.click(); }});

$('actingSelect').addEventListener('change', (e)=>{ state.currentUser = e.target.value; save(); render(); });
$('actingSelect').addEventListener('click', e=>e.stopPropagation());
$('resetBtn').addEventListener('click', ()=>{ if(confirm('Reset the prototype back to its starting demo data?')) resetAll(); });

/* theme toggle */
$('themeBtn').addEventListener('click', ()=>{
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const isDark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark?'light':'dark');
});

/* toast */
let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

/* boot */
$('brandGlyph').innerHTML = icon('swap',18);

$('themeBtn').innerHTML = icon('moon',16);
$('resetBtn').innerHTML = icon('reset',16);
